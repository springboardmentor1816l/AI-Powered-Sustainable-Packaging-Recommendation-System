<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EcoPackAI | Prediction Results</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./static/css/style.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand" href="index.html">EcoPackAI</a>
        <div class="navbar-nav">
            <a class="nav-link" href="product.html">Product</a>
            <a class="nav-link active" href="results.html">Results</a>
            <a class="nav-link" href="dashboard.html">Dashboard</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="mb-4">Sustainability Prediction Results</h2>

    <table class="table table-bordered">
        <thead class="table-success">
            <tr>
                <th>Metric</th>
                <th>Score</th>
            </tr>
        </thead>
        <tbody id="resultBody">
            <!-- Dynamic rows -->
        </tbody>
    </table>

    <a href="product.html" class="btn btn-secondary mt-3">
        Try Another Product
    </a>
</div>

<script>
    const result = JSON.parse(localStorage.getItem("ecoResult"));
    const body = document.getElementById("resultBody");

    if (!result) {
        body.innerHTML = `
            <tr>
                <td colspan="2">No prediction data available</td>
            </tr>
        `;
    } else {
        body.innerHTML = `
            <tr>
                <td>CO₂ Impact Score</td>
                <td>${result.co2_impact_score}</td>
            </tr>
            <tr>
                <td>Cost Impact Score</td>
                <td>${result.cost_impact_score}</td>
            </tr>
            <tr>
                <td>Final Sustainability Score</td>
                <td><strong>${result.final_sustainability_score}</strong></td>
            </tr>
        `;
    }
</script>

</body>
</html>
