version: '3.8'

services:
  backend:
    build:
      context: ..                     # project root
      dockerfile: environments/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../:/app                      # mount whole project for live edits
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
