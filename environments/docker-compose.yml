version: "3.9"

services:
  backend:
    build:
      context: ..
      dockerfile: environments/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - db


  db:
    image: postgres:15
    container_name: ecopackai_db
    environment:
      POSTGRES_DB: ecopackai_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    container_name: ecopackai_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

