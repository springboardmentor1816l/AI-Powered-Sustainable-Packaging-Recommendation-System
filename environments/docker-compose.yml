services:
  backend:
    build:
      context: ..
      dockerfile: ./environments/Dockerfile
    container_name: ecopack-backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      FLASK_APP: backend.app:create_app
      FLASK_ENV: development


  db:
    image: postgres:15
    container_name: ecopack-db
    restart: always
    environment:
      POSTGRES_USER: ecopack
      POSTGRES_PASSWORD: ecopack123
      POSTGRES_DB: ecopack_db
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    container_name: ecopack-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ecopack.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
