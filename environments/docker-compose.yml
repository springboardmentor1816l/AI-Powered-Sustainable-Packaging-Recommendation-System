services:
  backend:
    build:
      context: ..
      dockerfile: environments/Dockerfile
    container_name: ecopack-backend
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app/backend
    environment:
      API_KEY: ecopack-secret-key
    depends_on:
      - db
    restart: always

  db:
    image: mysql:8.0
    container_name: ecopack-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: mydb
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql

volumes:
  mysqldata:
