version: "3.9"

services:
  backend:
    build: .
    container_name: ecopackai_backend
    ports:
      - "8000:8000"
    volumes:
      - ../src:/app/src
    depends_on:
      - db

  db:
    image: mysql:9.2
    container_name: ecopackai_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Tanmay@123
      MYSQL_DATABASE: ecopackai_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  pgadmin:  # optional if using PostgreSQL
    image: dpage/pgadmin4
    container_name: ecopackai_pgadmin
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin

volumes:
  db_data:
