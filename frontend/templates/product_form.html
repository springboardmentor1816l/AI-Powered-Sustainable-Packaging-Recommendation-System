<!DOCTYPE html>
<html>
<head>
    <title>EcoPackAI – Product Input</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>

<div class="container mt-5">
    <div class="card shadow-lg">
        <div class="card-header bg-success text-white text-center">
            <h4>EcoPackAI – Product Details</h4>
            <small>Enter product information to get packaging recommendations</small>
        </div>

        <div class="card-body">
            <form id="productForm">

                <div class="mb-3">
                    <label class="form-label">Product Name</label>
                    <input type="text" class="form-control" id="productName">
                </div>

                <div class="mb-3">
                    <label class="form-label">Product Category</label>
                    <select class="form-select" id="category">
                        <option value="">Select category</option>
                        <option value="electronics">Electronics</option>
                        <option value="food">Food</option>
                        <option value="glass">Glass</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Weight (kg)</label>
                    <input type="number" class="form-control" id="weight">
                </div>

                <div class="mb-3">
                    <label class="form-label">Fragility Index (1–5)</label>
                    <input type="number" class="form-control" id="fragility">
                </div>

                <div id="errorMsg" class="text-danger mb-3"></div>

                <div class="text-center">
                    <button type="submit" class="btn btn-success px-4">
                        Get Recommendation
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

<script src="../static/js/predict.js"></script>

</body>
</html>
