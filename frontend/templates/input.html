{% extends "base.html" %}

{% block title %}Predict - EcoPackAI{% endblock %}

{% block content %}
<div class="row justify-content-center animate-fade-in">
    <div class="col-lg-8">
        <div class="card p-5">
            <h2 class="mb-4 text-center"><i class="bi bi-box-seam-fill me-2 text-primary"></i>Product Details</h2>
            <form id="predictionForm">
                <div class="mb-3">
                    <label for="productName" class="form-label"><i class="bi bi-tag-fill me-2"></i>Product Name</label>
                    <input type="text" class="form-control" id="productName" required>
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="productCategory" class="form-label"><i class="bi bi-grid-fill me-2"></i>Category</label>
                        <select class="form-select" id="productCategory" required>
                            <option value="">Select Category</option>
                            <option value="electronics">Electronics</option>
                            <option value="clothing">Clothing</option>
                            <option value="furniture">Furniture</option>
                            <option value="food">Food & Beverage</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="productWeight" class="form-label"><i class="bi bi-speedometer2 me-2"></i>Weight (g)</label>
                        <input type="number" class="form-control" id="productWeight" min="0.1" step="0.1" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="fragilityScore" class="form-label"><i class="bi bi-shield-exclamation me-2"></i>Fragility Score (0-1)</label>
                        <input type="number" class="form-control" id="fragilityScore" min="0" max="1" step="0.1" required>
                        <div class="form-text text-muted">0 = Robust, 1 = Very Fragile</div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="transportDistance" class="form-label"><i class="bi bi-truck me-2"></i>Transport Distance (km)</label>
                        <input type="number" class="form-control" id="transportDistance" min="1" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="materialType" class="form-label"><i class="bi bi-layers-fill me-2"></i>Current Material</label>
                        <select class="form-select" id="materialType" required>
                            <option value="">Select Material</option>
                            <option value="cardboard">Cardboard</option>
                            <option value="plastic">Plastic</option>
                            <option value="wood">Wood</option>
                            <option value="metal">Metal</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="recyclabilityScore" class="form-label"><i class="bi bi-recycle me-2"></i>Recyclability Score (0-1)</label>
                        <input type="number" class="form-control" id="recyclabilityScore" min="0" max="1" step="0.1" required>
                    </div>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-lg" id="predictBtn">
                        <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                        Get Recommendation
                    </button>
                </div>
                
                <div id="errorAlert" class="alert alert-danger mt-3 d-none" role="alert"></div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/predict.js') }}"></script>
{% endblock %}
