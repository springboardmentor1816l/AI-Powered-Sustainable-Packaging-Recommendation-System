<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>EcoPackAI Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>

    <div class="container mt-5">
        <h3 class="mb-3">📊 Recommendation Result</h3>
        <div class="mt-4 text-center">
            <a href="product.html" class="btn btn-outline-primary btn-lg">
                🔙 Back to Recommendation
            </a>
        </div>


        <div id="prediction-text"></div>

        <table class="table table-bordered mt-3">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Material</th>
                    <th>Predicted Cost</th>
                    <th>CO₂ Impact</th>
                    <th>Sustainability</th>
                </tr>
            </thead>
            <tbody id="result-table-body"></tbody>
        </table>

        <canvas id="costChart" height="120"></canvas>
        <canvas id="co2Chart" height="120"></canvas>

        <div class="mt-3">
            <button class="btn btn-primary" onclick="exportToCSV()">⬇ Export CSV</button>
            <button class="btn btn-secondary" onclick="exportToPDF()">🧾 Export PDF</button>
        </div>

    </div>

    <script src="../static/js/results.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/js/charts.js"></script>
    <script src="/static/js/export.js"></script>
</body>

</html>
