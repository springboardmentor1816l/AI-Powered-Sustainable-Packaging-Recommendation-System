<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoPackAI - Sustainability Recommendation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>

    <nav class="navbar navbar-dark mb-5">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <span class="me-2">🌿</span> EcoPackAI
            </a>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div class="card">
                    <div class="card-header-accent"></div>
                    <div class="p-4 p-md-5">

                        <h2 class="mb-2 text-center">Package Configurator</h2>
                        <p class="text-center text-muted mb-5">
                            Provide product details to generate a sustainable packaging recommendation.
                        </p>

                        <form id="predictionForm" novalidate>

                        
                            <div class="row g-4">
                        
                                <div class="col-md-12">
                                    <label class="form-label">Product Name</label>
                                    <input type="text" class="form-control" id="product_name" placeholder="e.g. Glass Water Bottle" required>
                                </div>
                        
                                <div class="col-md-6">
                                    <label class="form-label">Product Category</label>
                                    <select class="form-select" id="category" required>
                                        <option value="">Select a category</option>
                                        <option>Electronics</option>
                                        <option>Cosmetics</option>
                                        <option>Food/Beverage</option>
                                        <option>Retail</option>
                                    </select>
                                </div>
                        
                                <div class="col-md-6">
                                    <label class="form-label">Shipping Method</label>
                                    <select class="form-select" id="shipping_type" required>
                                        <option value="">Select shipping</option>
                                        <option>Air</option>
                                        <option>Ground</option>
                                        <option>Sea</option>
                                    </select>
                                </div>
                        
                                <div class="col-md-6">
                                    <label class="form-label">Weight (kg)</label>
                                    <input type="number" step="0.01" class="form-control" id="product_weight" placeholder="0.5" required>
                                </div>
                        
                                <div class="col-md-6">
                                    <label class="form-label">Fragility Index (0–1)</label>
                                    <input type="number" step="0.1" min="0" max="1" class="form-control" id="fragility_index" placeholder="0.3"
                                        required>
                                </div>
                        
                            </div>
                        
                            <div class="mt-5 d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    Generate Recommendation
                                </button>
                            </div>
                        
                        </form>


                        <!-- RESULT SECTION -->
                        <div id="result-container" class="mt-4 p-4" style="display:none;">
                            <h4>📊 Analysis Result</h4>
                            <div id="prediction-text" class="mb-3"></div>
                            <hr>

                            <table class="table table-bordered">
                                <thead>
                                    <tr>
                                        <th>Rank</th>
                                        <th>Material</th>
                                        <th>Predicted Cost</th>
                                        <th>CO₂ Impact</th>
                                        <th>Sustainability</th>
                                    </tr>
                                </thead>
                                <tbody id="result-table-body"></tbody>
                            </table>

                            <h4 class="mt-4">📊 Sustainability Analysis</h4>

                            <canvas id="costChart" height="120"></canvas>
                            <canvas id="co2Chart" height="120"></canvas>

                            <div class="mt-3">
                                <button class="btn btn-primary" onclick="exportToCSV()">⬇ Export CSV</button>
                                <button class="btn btn-secondary" onclick="exportToPDF()">🧾 Export PDF</button>
                            </div>

                        </div>

                    </div>
                </div>

                <p class="footer-text text-center mt-4">
                    EcoPackAI v1.0 • Built for Sustainable Logistics Modeling
                </p>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../static/js/charts.js"></script>
    <script src="../static/js/export.js"></script>
    <script src="../static/js/predict.js"></script>




</body>

</html>
