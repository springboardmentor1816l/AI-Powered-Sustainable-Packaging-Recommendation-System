<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Input | EcoPackAI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <h2 class="mb-4">Product Input</h2>

  <div id="alert-box"></div>

  <form id="productForm">

    <div class="mb-3">
      <label class="form-label">Product Name</label>
      <input type="text" id="product_name" class="form-control" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Category</label>
      <select id="category" class="form-select" required>
        <option value="">Select</option>
        <option>Food</option>
        <option>Electronics</option>
        <option>Cosmetics</option>
        <option>Pharmacy</option>
        <option>Paper Product</option>
        <option>Drinkware</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Product Weight (kg)</label>
      <input type="number" id="product_weight" class="form-control" min="0.01" step="0.01" required>
    </div>

    <div class="mb-3">
      <label class="form-label">
        Fragility Index (1 = Low, 5 = High)
      </label>
      <input type="range" id="fragility_index" class="form-range" min="1" max="5" step="1">
      <div>Selected: <span id="fragility_value">3</span></div>
    </div>

    <div class="mb-4">
      <label class="form-label">Shipping Type</label>
      <select id="shipping_type" class="form-select" required>
        <option value="">Select</option>
        <option>Air</option>
        <option>Road</option>
        <option>Sea</option>
      </select>
    </div>

    <button type="submit" id="submitBtn" class="btn btn-success">
      Predict
    </button>
  </form>

  <!-- Loading Indicator -->
  <div id="loadingBox" class="text-center mt-4 d-none">
    <div class="spinner-border text-success" role="status"></div>
    <p class="mt-2">Analyzing sustainable packaging options…</p>
  </div>

</div>

<script src="assets/js/predict.js"></script>
</body>
</html>
