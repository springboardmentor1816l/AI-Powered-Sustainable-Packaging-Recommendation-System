<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EcoPackAI – Product Input</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="index.html">EcoPackAI</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="predict.html">Predict</a></li>
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Form Section -->
    <section class="py-5">
        <div class="container">
            <h2 class="mb-4 text-center">Product Packaging Input</h2>

            <form id="predictForm" class="mx-auto" style="max-width: 600px;">
                
                <div class="mb-3">
                    <label class="form-label">Product Name</label>
                    <input type="text" class="form-control" id="productName" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Product Category</label>
                    <select class="form-select" id="category" required>
                        <option value="">Select category</option>
                        <option>Electronics</option>
                        <option>Food</option>
                        <option>Clothing</option>
                        <option>Medical</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Weight (kg)</label>
                    <input type="number" class="form-control" id="weight" min="0.1" step="0.1" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Fragility Index (1–5)</label>
                    <input type="number" class="form-control" id="fragility" min="1" max="5" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Shipping Type</label>
                    <select class="form-select" id="shipping" required>
                        <option value="">Select shipping type</option>
                        <option>Air</option>
                        <option>Ground</option>
                        <option>Sea</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-success w-100">
                    Predict Sustainable Packaging
                </button>

            </form>
        </div>
    </section>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/predict.js"></script>
</body>
</html>
