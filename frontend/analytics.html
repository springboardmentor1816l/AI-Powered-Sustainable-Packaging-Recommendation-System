<!DOCTYPE html>
<html>
<head>
  <title>EcoPackAI Analytics</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-light">

<div class="container mt-5">
  <h2 class="text-center">Analytics Dashboard</h2>
  <p class="text-center text-muted">
    Cost, CO₂ impact & sustainability insights
  </p>

  <canvas id="costChart" class="mb-4"></canvas>
  <canvas id="co2Chart" class="mb-4"></canvas>
  <canvas id="scoreChart" class="mb-4"></canvas>

  <div class="text-center">
    <button class="btn btn-success" onclick="exportCSV()">
      Export CSV
    </button>
  </div>
</div>

<script src="analytics.js"></script>
</body>
</html>
