<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EcoPackAI – Analytics</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
  />

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="container mt-5">

  <h2 class="mb-4">📊 Prediction Analytics</h2>

  <p id="total"></p>

  <div class="row">
    <div class="col-md-6">
      <canvas id="materialChart"></canvas>
    </div>

    <div class="col-md-6">
      <canvas id="shippingChart"></canvas>
    </div>
  </div>

<script>
async function loadAnalytics() {
  const res = await fetch("http://127.0.0.1:5001/analytics");
  const data = await res.json();

  document.getElementById("total").innerText =
    "Total Predictions: " + data.total_predictions;

  new Chart(document.getElementById("materialChart"), {
    type: "pie",
    data: {
      labels: Object.keys(data.materials),
      datasets: [{
        data: Object.values(data.materials)
      }]
    }
  });

  new Chart(document.getElementById("shippingChart"), {
    type: "bar",
    data: {
      labels: Object.keys(data.shipping_types),
      datasets: [{
        label: "Shipping Type Usage",
        data: Object.values(data.shipping_types)
      }]
    }
  });
}

loadAnalytics();
</script>

</body>
</html>
