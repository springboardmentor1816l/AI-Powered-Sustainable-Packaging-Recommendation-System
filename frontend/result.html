<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EcoPackAI – Recommendation Results</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand" href="index.html">EcoPackAI</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="predict.html">Predict</a></li>
                <li class="nav-item"><a class="nav-link active" href="result.html">Results</a></li>
                <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Results Section -->
<section class="py-5 bg-light">
    <div class="container">
        <h2 class="text-center mb-4">Packaging Recommendation</h2>

        <div id="resultsContainer" class="row justify-content-center">
            <div class="col-md-8 text-center">
                <p class="text-muted">Loading prediction results...</p>
            </div>
        </div>

        <!-- Export Buttons -->
        <div class="text-center mt-3">
            <button id="exportCSV" class="btn btn-outline-success me-2">Download CSV</button>
            <button id="exportPDF" class="btn btn-success">Download PDF</button>
        </div>

        <div class="text-center mt-4">
            <a href="predict.html" class="btn btn-outline-success me-2">Try Another Product</a>
            <a href="dashboard.html" class="btn btn-success">View Analytics Dashboard</a>
        </div>
    </div>
</section>

<!-- Analytics Section -->
<section class="py-5">
    <div class="container">
        <h3 class="text-center mb-4">Analytics & Sustainability Insights</h3>

        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card shadow">
                    <div class="card-body">
                        <h6 class="text-center">CO₂ Footprint by Material</h6>
                        <canvas id="co2Chart"></canvas>
                    </div>
                </div>
            </div>

            <div class="col-md-6 mb-4">
                <div class="card shadow">
                    <div class="card-body">
                        <h6 class="text-center">Cost Comparison</h6>
                        <canvas id="costChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Footer -->
<footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">© 2026 EcoPackAI | Sustainable Packaging Intelligence</p>
</footer>

<!-- Libraries -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Main Logic -->
<script>
document.addEventListener("DOMContentLoaded", () => {
    const container = document.getElementById("resultsContainer");
    const storedResult = localStorage.getItem("predictionResult");

    if (!storedResult) {
        container.innerHTML = `<p class="text-danger text-center">No prediction data found.</p>`;
        return;
    }

    const result = JSON.parse(storedResult);
    const predictions = result.predictions || [];

    let rows = "";
    predictions.forEach((item, index) => {
        rows += `
            <tr class="${index === 0 ? 'table-success' : ''}">
                <td>${index + 1}</td>
                <td>${item.material_type}</td>
                <td>${item.predicted_cost}</td>
                <td>${item.predicted_co2}</td>
                <td>${item.biodegradability_percent}%</td>
            </tr>
        `;
    });

    container.innerHTML = `
        <div class="col-md-10">
            <div class="card shadow">
                <div class="card-body">
                    <h5 class="text-center mb-3">Sustainable Packaging Recommendations</h5>
                    <table class="table table-bordered text-center">
                        <thead class="table-dark">
                            <tr>
                                <th>Rank</th>
                                <th>Material</th>
                                <th>Cost($)</th>
                                <th>CO₂(kg)</th>
                                <th>Biodegradability</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                    <p class="text-muted text-center">Top-ranked material highlighted</p>
                </div>
            </div>
        </div>
    `;

    // Charts
    const labels = predictions.map(p => p.material_type);
    new Chart(co2Chart, {
        type: "bar",
        data: { labels, datasets: [{ label: "CO₂ (kg)", data: predictions.map(p => p.predicted_co2) }] }
    });

    new Chart(costChart, {
        type: "bar",
        data: { labels, datasets: [{ label: "Cost($)", data: predictions.map(p => p.predicted_cost) }] }
    });

    // CSV Export
    exportCSV.onclick = () => {
        let csv = "Rank,Material,Cost,CO2,Biodegradability\n";
        predictions.forEach((p, i) => {
            csv += `${i+1},${p.material_type},${p.predicted_cost},${p.predicted_co2},${p.biodegradability_percent}\n`;
        });
        const blob = new Blob([csv], { type: "text/csv" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "ecopackai_results.csv";
        a.click();
    };

    // PDF Export
    exportPDF.onclick = () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text("EcoPackAI Sustainability Report", 20, 20);
        let y = 40;
        predictions.forEach((p, i) => {
            doc.text(`Rank ${i+1}: ${p.material_type}`, 20, y);
            doc.text(`Cost: ${p.predicted_cost}, CO₂: ${p.predicted_co2}, Bio: ${p.biodegradability_percent}%`, 20, y+10);
            y += 25;
        });
        doc.save("ecopackai_report.pdf");
    };
});
</script>

</body>
</html>
