<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EcoPackAI – Packaging Recommendation</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="container">
  <h1>🌱 EcoPackAI – Packaging Recommendation</h1>

  <form id="productForm">

    <div class="form-row">
      <div class="form-group">
        <label>Product Name</label>
        <input id="productName" placeholder="e.g. Smartphone" />
      </div>

      <div class="form-group">
        <label>Category</label>
        <select id="category">
          <option value="">Select</option>
          <option value="Electronics">Electronics</option>
          <option value="Food">Food</option>
          <option value="Cosmetics">Cosmetics</option>
        </select>
      </div>

      <div class="form-group">
        <label>Weight (kg)</label>
        <input id="weight" type="number" step="0.01" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>
          Fragility Index:
          <span id="fragilityValue">3</span>
          <span id="fragilityLabel">(Medium)</span>
        </label>
        <input id="fragility" type="range" min="1" max="5" value="3" />
      </div>

      <div class="form-group">
        <label>Shipping Method</label>
        <select id="shipping">
          <option value="">Select</option>
          <option value="Air">Air</option>
          <option value="Road">Road</option>
          <option value="Sea">Sea</option>
        </select>
      </div>
    </div>

    <button type="submit">Get Recommendation</button>
    <p id="errorBox"></p>

  </form>
</div>

<script src="js/predict.js"></script>
</body>
</html>
