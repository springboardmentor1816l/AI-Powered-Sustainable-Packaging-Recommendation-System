<!DOCTYPE html>
<html>
<head>
  <title>EcoPackAI</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body style="background:#f4f7f6;">

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">

      <div class="card shadow-lg p-4">
        <h2 class="text-center fw-bold">Package Configurator</h2>
        <p class="text-center text-muted">
          Provide product details to generate a sustainable packaging recommendation.
        </p>

        <form id="productForm">

          <div class="mb-3">
            <label class="form-label">Product Name</label>
            <input id="productName" class="form-control">
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Category</label>
              <select id="category" class="form-select">
                <option value="">Select</option>
                <option>Electronics</option>
                <option>Food</option>
                <option>Clothing</option>
              </select>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Shipping</label>
              <select id="shipping" class="form-select">
                <option value="">Select</option>
                <option>Road</option>
                <option>Air</option>
              </select>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Weight (kg)</label>
              <input type="number" id="weight" class="form-control">
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Fragility (0–1)</label>
              <input type="number" step="0.1" id="fragility" class="form-control">
            </div>
          </div>

          <div class="d-grid">
            <button class="btn btn-success btn-lg">
              Generate Recommendation
            </button>
          </div>

        </form>

        <p id="errorMsg" class="text-danger text-center mt-3"></p>

        <!-- Result Table -->
        <table id="resultTable" class="table table-bordered mt-4 d-none">
          <thead class="table-success">
            <tr>
              <th>Rank</th>
              <th>Material</th>
              <th>Cost</th>
              <th>CO₂</th>
              <th>Score</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>

      </div>

      <p class="text-center text-muted mt-4">
        EcoPackAI v1.0 • Sustainable Logistics
      </p>

    </div>
  </div>
</div>

<script src="predict.js"></script>
</body>
</html>
