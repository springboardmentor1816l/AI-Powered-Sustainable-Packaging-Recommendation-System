<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Results | EcoPackAI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <h2 class="mb-4">Top Sustainable Packaging Recommendations</h2>

  <table class="table table-bordered table-hover">
    <thead class="table-success">
      <tr>
        <th>Rank</th>
        <th>Material</th>
        <th>Predicted Cost</th>
        <th>Predicted CO₂</th>
        <th>Sustainability Score</th>
      </tr>
    </thead>
    <tbody id="results-body"></tbody>
  </table>

  <a href="product_form.html" class="btn btn-secondary mt-3">
    New Prediction
  </a>
</div>

<script>
const data = JSON.parse(sessionStorage.getItem("prediction_result"));

if (data) {
  const rows = data.map(item => `
    <tr>
      <td>${item.rank}</td>
      <td>${item.material_name}</td>
      <td>${item.predicted_cost.toFixed(3)}</td>
      <td>${item.predicted_co2.toFixed(3)}</td>
      <td>${item.sustainability_score.toFixed(3)}</td>
    </tr>
  `).join("");

  document.getElementById("results-body").innerHTML = rows;
}
</script>

</body>
</html>
