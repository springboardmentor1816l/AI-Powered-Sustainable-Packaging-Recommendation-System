<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Recommendation Result</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
  />
</head>

<body class="container mt-5">

  <h2 class="mb-4">Sustainable Packaging Recommendation</h2>

  <!-- Result Table -->
  <table class="table table-bordered table-striped">
    <thead class="table-success">
      <tr>
        <th>Rank</th>
        <th>Material</th>
        <th>Suitability Score</th>
        <th>Remark</th>
      </tr>
    </thead>
    <tbody id="resultBody"></tbody>
  </table>

  <a href="predict.html" class="btn btn-secondary mt-3">
    Try Another Product
  </a>

  <script>
    const result = JSON.parse(localStorage.getItem("prediction"));
    const productName = localStorage.getItem("product_name");

    const tbody = document.getElementById("resultBody");

    if (!result || !result.prediction) {
      tbody.innerHTML = `
        <tr>
          <td colspan="4" class="text-danger text-center">
            No recommendation data available.
          </td>
        </tr>
      `;
    } else {
      const score = result.prediction;

      let remark = "Moderate suitability";
      if (score >= 80) remark = "Excellent sustainable choice";
      else if (score >= 60) remark = "Good sustainable choice";
      else if (score >= 40) remark = "Average – improvements possible";
      else remark = "Low suitability";

      tbody.innerHTML = `
        <tr>
          <td><strong>1</strong></td>
          <td>Recommended Packaging Material</td>
          <td><strong>${score}%</strong></td>
          <td>${remark}</td>
        </tr>
      `;
    }
  </script>

</body>
</html>
