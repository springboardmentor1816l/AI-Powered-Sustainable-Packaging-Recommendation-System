<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>EcoPackAI</title>
  <link rel="stylesheet" href="static/css/style.css">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">
    <h1>EcoPackAI — Packaging Recommendation</h1>
    <form id="reqForm">
      <div class="mb-3">
        <label for="product_id" class="form-label">Product ID</label>
        <input id="product_id" class="form-control" />
      </div>
      <button type="button" class="btn btn-primary" onclick="submitReq()">Get Recommendations</button>
    </form>

    <pre id="result" class="mt-3"></pre>
  </div>

<script>
async function submitReq(){
  const product_id = document.getElementById("product_id").value;
  const payload = { product_id, weight_g: 500, dimensions_cm: {l:10,w:5,h:5}, priority: ["cost","co2"] };
  const res = await fetch("/api/recommend", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  document.getElementById("result").textContent = JSON.stringify(data, null, 2);
}
</script>
</body>
</html>
