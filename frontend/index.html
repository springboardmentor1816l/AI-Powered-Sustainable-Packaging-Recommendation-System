<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EcoPackAI – Sustainable Packaging Recommendation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #eef2f7, #f9fbfd);
            margin: 0;
            padding: 30px;
            color: #2c3e50;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            margin-bottom: 6px;
            font-size: 32px;
        }
        header p {
            color: #555;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .card {
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        .card h2 {
            margin-top: 0;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        label {
            font-weight: 600;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 9px;
            border-radius: 6px;
            border: 1px solid #ccc;
            margin-top: 5px;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #2ecc71;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #2ecc71;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #27ae60;
        }

        .error {
            margin-bottom: 15px;
            color: #c0392b;
            font-weight: bold;
        }

        .loading {
            margin-bottom: 15px;
            color: #2980b9;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #2c3e50;
            color: white;
        }

        tr.top {
            background: #eafaf1;
            font-weight: bold;
        }

        footer {
            text-align: center;
            color: #777;
            margin-top: 40px;
        }
    </style>
</head>
<body>

<header>
    <h1>EcoPackAI</h1>
    <p>AI-Powered Sustainable Packaging Recommendation System</p>
</header>

<div class="container">

    <!-- PRODUCT INPUT -->
    <div class="card">
        <h2>Product Input Details</h2>

        <div id="errorBox" class="error"></div>
        <div id="loading" class="loading" style="display:none;">⏳ Fetching recommendations...</div>

        <form id="predictForm">

            <div class="grid">
                <div>
                    <label>Product Name</label>
                    <input type="text" id="product_name" placeholder="Organic Snack Box">
                </div>

                <div>
                    <label>Product Category</label>
                    <select id="product_category">
                        <option value="">Select</option>
                        <option value="food">Food</option>
                        <option value="electronics">Electronics</option>
                    </select>
                </div>

                <div>
                    <label>Shipping Type</label>
                    <select id="shipping_type">
                        <option value="">Select</option>
                        <option value="road">Road</option>
                        <option value="air">Air</option>
                        <option value="sea">Sea</option>
                    </select>
                </div>

                <div>
                    <label>Weight (kg)</label>
                    <input type="number" step="0.01" id="product_weight">
                </div>

                <div>
                    <label>Fragility Index (0–1)</label>
                    <input type="number" step="0.01" id="fragility_score">
                </div>

                <div>
                    <label>Moisture Sensitivity (0–1)</label>
                    <input type="number" step="0.01" id="moisture_sensitivity">
                </div>

                <div>
                    <label>Thermal Sensitivity (0–1)</label>
                    <input type="number" step="0.01" id="thermal_sensitivity">
                </div>

                <div>
                    <label>Shelf Life (days)</label>
                    <input type="number" id="expected_shelf_life_days">
                </div>

                <div>
                    <label>Material Cost / Kg</label>
                    <input type="number" step="0.01" id="material_cost_per_kg">
                </div>

                <div>
                    <label>CO₂ Emission / Kg</label>
                    <input type="number" step="0.01" id="co2_emission_per_kg">
                </div>

                <div>
                    <label>Biodegradability (%)</label>
                    <input type="number" id="biodegradability_percent">
                </div>

                <div>
                    <label>Load Handling (0–1)</label>
                    <input type="number" step="0.01" id="load_handling_score">
                </div>

                <div>
                    <label>Sustainability Score</label>
                    <input type="number" id="sustainability_score">
                </div>

                <div>
                    <label>Hazardous Material</label>
                    <select id="hazardous_material_flag">
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>

                <div>
                    <label>Recyclability</label>
                    <select id="recyclability_category">
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select>
                </div>

                <div>
                    <label>Supplier Region</label>
                    <select id="supplier_region">
                        <option value="india">India</option>
                        <option value="global">Global</option>
                    </select>
                </div>

                <div>
                    <label>Material Type</label>
                    <select id="material_type">
                        <option value="cardboard">Cardboard</option>
                        <option value="plastic">Plastic</option>
                        <option value="bioplastic">Bioplastic</option>
                    </select>
                </div>
            </div>

            <button type="submit">Get Recommendation</button>
        </form>
    </div>

    <!-- RESULTS -->
    <div class="card" id="resultCard" style="display:none;">
        <h2>Recommended Packaging Materials</h2>

        <table id="resultTable">
            <thead>
                <tr>
                    <th>Material</th>
                    <th>Predicted Cost</th>
                    <th>CO₂ Footprint</th>
                    <th>Sustainability Score</th>
                    <th>Rank</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

</div>

<footer>
    Analytics Dashboard – Coming Soon
</footer>

<script src="predict.js"></script>
</body>
</html>
