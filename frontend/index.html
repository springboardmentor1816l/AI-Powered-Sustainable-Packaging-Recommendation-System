<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EcoPackAI – Sustainable Packaging Recommendation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Charts & PDF -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #eef2f7, #f9fbfd);
            padding: 30px;
            margin: 0;
            color: #2c3e50;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 34px;
            margin-bottom: 6px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .card {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        label {
            font-weight: 600;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 9px;
            border-radius: 6px;
            border: 1px solid #ccc;
            margin-top: 5px;
        }

        button {
            margin-top: 25px;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            border: none;
            background: #2ecc71;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover { background: #27ae60; }

        .error { color: #c0392b; font-weight: bold; }
        .loading { color: #2980b9; font-weight: bold; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #2c3e50;
            color: #fff;
        }

        tr.top { background: #eafaf1; font-weight: bold; }

        canvas { margin-top: 20px; }

        .export-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            color: #777;
        }
    </style>
</head>

<body>

<header>
    <h1>EcoPackAI</h1>
    <p>AI-Powered Sustainable Packaging Recommendation System</p>
</header>

<div class="container">

    <!-- INPUT -->
    <div class="card">
        <h2>Product Input</h2>
        <div id="errorBox" class="error"></div>
        <div id="loading" class="loading" style="display:none;">⏳ Fetching recommendations...</div>

        <form id="predictForm">
            <div class="grid">
                <input id="product_name" placeholder="Product Name">
                <select id="product_category"><option value="">Category</option><option value="food">Food</option><option value="electronics">Electronics</option></select>
                <select id="shipping_type"><option value="">Shipping</option><option value="road">Road</option><option value="air">Air</option><option value="sea">Sea</option></select>
                <input type="number" id="product_weight" placeholder="Weight (kg)">
                <input type="number" step="0.01" id="fragility_score" placeholder="Fragility (0–1)">
                <input type="number" step="0.01" id="moisture_sensitivity" placeholder="Moisture (0–1)">
                <input type="number" step="0.01" id="thermal_sensitivity" placeholder="Thermal (0–1)">
                <input type="number" id="expected_shelf_life_days" placeholder="Shelf Life (days)">
                <input type="number" step="0.01" id="material_cost_per_kg" placeholder="Cost / Kg">
                <input type="number" step="0.01" id="co2_emission_per_kg" placeholder="CO₂ / Kg">
                <input type="number" step="0.01" id="biodegradability_percent" placeholder="Biodegradability %">
                <input type="number" step="0.01" step="0.01" id="load_handling_score" placeholder="Load Handling">
                <input type="number" step="0.01" id="sustainability_score" placeholder="Sustainability Score">

                <select id="hazardous_material_flag"><option value="0">Non-Hazardous</option><option value="1">Hazardous</option></select>
                <select id="recyclability_category"><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select>
                <select id="supplier_region"><option value="india">India</option><option value="global">Global</option></select>
                <select id="material_type"><option value="cardboard">Cardboard</option><option value="plastic">Plastic</option><option value="bioplastic">Bioplastic</option></select>
            </div>
            <button type="submit">Get Recommendation</button>
        </form>
    </div>

    <!-- RESULTS -->
    <div class="card" id="resultCard" style="display:none;">
        <h2>Recommendations</h2>
        <table id="resultTable">
            <thead>
                <tr><th>Material</th><th>Cost</th><th>CO₂</th><th>Sustainability</th><th>Rank</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- ANALYTICS -->
    <div class="card" id="analyticsCard" style="display:none;">
        <h2>Analytics</h2>
        <canvas id="costChart"></canvas>
        <canvas id="co2Chart"></canvas>
        <canvas id="sustainabilityChart"></canvas>

        <div class="export-buttons">
            <button id="exportCSV">⬇ Export CSV</button>
            <button id="exportPDF">⬇ Export PDF</button>
        </div>
    </div>

</div>

<footer>EcoPackAI · Analytics & Reporting</footer>

<script src="predict.js"></script>
</body>
</html>
