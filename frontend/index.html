<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EcoPack AI – Packaging Recommendation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>🌱 EcoPack AI</h1>
  <p>AI-Powered Sustainable Packaging Recommendation</p>

  <form id="predictForm">
    <label>Weight</label>
    <input type="number" id="weight" required />

    <label>Volume</label>
    <input type="number" id="volume" required />

    <label>Fragility</label>
    <input type="number" id="fragility" required />

    <button type="submit">Predict</button>
  </form>

  <h2>Result</h2>
  <pre id="result">Waiting for prediction...</pre>

  <script src="app.js"></script>
</body>
</html>
