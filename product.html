<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EcoPackAI - Package Configurator</title>

  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f4f7f6;">

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">

      <div class="card shadow-lg p-4">

        <h2 class="text-center fw-bold">Package Configurator</h2>
        <p class="text-center text-muted">
          Provide product details to generate a sustainable packaging recommendation.
        </p>

        <!-- FORM -->
        <form id="productForm">

          <div class="mb-3">
            <label class="form-label">Product Name</label>
            <input type="text" id="productName" class="form-control" placeholder="e.g. Laptop">
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Product Category</label>
              <select id="categorySelect" class="form-select">
                <option value="">Select</option>
                <option value="Electronics">Electronics</option>
                <option value="Food">Food</option>
                <option value="Clothing">Clothing</option>
              </select>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Shipping Method</label>
              <select id="shippingSelect" class="form-select">
                <option value="">Select</option>
                <option value="Ground">Ground</option>
                <option value="Air">Air</option>
              </select>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Weight (kg)</label>
              <input type="number" id="weightInput" class="form-control" min="0.01" step="0.01" placeholder="e.g. 1.25">
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Fragility Index (0–1)</label>
              <input type="number" id="fragilityInput" class="form-control" min="0" max="1" step="0.1" placeholder="e.g. 0.6">
            </div>
          </div>

          <p id="errorMsg" class="text-danger text-center"></p>

          <div class="d-grid">
            <button type="submit" class="btn btn-success btn-lg">
              Generate Recommendation
            </button>
          </div>
        </form>

        <!-- RESULT (SAME PAGE) -->
        <div id="resultBox" class="mt-4 d-none">
          <h5 class="text-success">Recommended Packaging</h5>
          <ul id="resultText"></ul>
        </div>

      </div>

      <p class="text-center text-muted mt-4">
        EcoPackAI v1.0 • Built for Sustainable Logistics Modeling
      </p>

    </div>
  </div>
</div>

<!-- IMPORTANT: JS FILE IN SAME FOLDER -->
<script src="predict.js"></script>
</body>
</html>
